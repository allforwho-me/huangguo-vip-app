name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Fix hardcoded flutter.sdk path in settings.gradle
        run: |
          python3 - <<'PY'
          import os, re, shutil, pathlib
          p = pathlib.Path('android/settings.gradle')
          s = p.read_text()
          sdk = os.environ.get('FLUTTER_ROOT') or os.path.dirname(
              os.path.dirname(shutil.which('flutter')))
          replacement = (
              'def flutterSdkPath = new File(System.getenv("FLUTTER_ROOT") ?: "%s")'
              '.getAbsolutePath()' % sdk
          )
          s2, n = re.subn(
              r'def flutterSdkPath\s*=\s*new File\([^)]*\)\.getAbsolutePath\(\)',
              replacement, s)
          if n == 0:
              print('WARN: pattern not found, settings.gradle untouched')
          p.write_text(s2)
          print('--- patched head ---')
          print('\n'.join(s2.splitlines()[:8]))
          PY

      - name: Ensure gradle wrapper exists
        run: |
          set -e
          if [ -f android/gradlew ]; then
            echo "gradlew already present, skip"
            chmod +x android/gradlew
            exit 0
          fi

          # Pin a Gradle 8.x binary: the runner default (9.x) cannot compile
          # Flutter 3.24.x's gradle plugin (groovy.xml.QName was removed in Groovy 4).
          GRADLE_BIN=""
          if command -v gradle >/dev/null 2>&1; then
            GV="$(gradle --version 2>/dev/null | awk '/^Gradle /{print $2}')"
            case "$GV" in
              8.*) GRADLE_BIN="$(command -v gradle)" ;;
            esac
          fi
          if [ -z "$GRADLE_BIN" ]; then
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            GRADLE_BIN="/tmp/gradle-8.7/bin/gradle"
          fi
          echo "wrapper generator: $GRADLE_BIN"
          "$GRADLE_BIN" --version | head -n 4

          # Generate the wrapper in an EMPTY dir so no project settings get evaluated.
          # Gradle 8.x refuses to run any task without a settings file, so give it a stub one.
          rm -rf /tmp/wrapgen && mkdir -p /tmp/wrapgen
          printf "rootProject.name = 'wrapgen'\n" > /tmp/wrapgen/settings.gradle
          ( cd /tmp/wrapgen && "$GRADLE_BIN" wrapper --gradle-version 8.7 --distribution-type bin --no-daemon )

          cp -r /tmp/wrapgen/gradle "$GITHUB_WORKSPACE/android/"
          cp /tmp/wrapgen/gradlew /tmp/wrapgen/gradlew.bat "$GITHUB_WORKSPACE/android/"
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"
          echo "--- wrapper properties ---"
          cat "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.properties"

      - name: Restore standard gradle build dir
        run: |
          set -e
          f=android/build.gradle
          if grep -q "rootProject.buildDir" "$f"; then
            echo "buildDir already configured, skip"
          else
            cat >> "$f" <<'EOF'

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}
EOF
            echo "appended buildDir override"
          fi
          echo "--- android/build.gradle ---"
          cat "$f"

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release
          echo "flutter exit code: $?"
          echo "--- where did gradle put things? ---"
          find . -maxdepth 3 -type d -name build -not -path "./build/*" 2>/dev/null
          ls -R build/app/outputs 2>/dev/null || echo "no ./build/app/outputs"
          ls -R android/app/build/outputs 2>/dev/null || echo "no android/app/build/outputs"
          echo "--- collecting any apk under the workspace ---"
          mkdir -p out
          find . -name "*.apk" -type f -not -path "./out/*" -exec cp -v {} out/ \;
          ls -lh out 2>/dev/null
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "::error::No APK produced at all - real build failure"
            exit 1
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: huangguo-vip-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
